<main class="wrap">
  <header class="page-head reveal">
    <div class="label blue">[ Bibliography · <span id="total">18</span> entries ]</div>
    <h1>Publications</h1>
    <p>Peer-reviewed articles, preprints and book chapters. Expand any entry to read the abstract.</p>
  </header>

  <div class="toolbar">
    <div class="chips" id="years" role="group" aria-label="Filter by year"></div>
    <input class="search" id="q" type="search" placeholder="Search title, author, journal…" aria-label="Search publications">
  </div>

  <ol class="pub-list" id="list"></ol>
  <div class="count" id="count"></div>
</main>

<footer style="margin-top:96px">
  <div class="wrap">
    <span>© <span id="year">2026</span> Satyam Sangeet</span>
    <a href="https://scholar.google.com.au/citations?user=GgF3yTYAAAAJ&amp;hl=en" target="_blank" rel="noopener">Google Scholar profile ↗</a>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
  (function () {
    const all = window.PUBLICATIONS;
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const yearsEl = document.getElementById('years');
    const q = document.getElementById('q');
    document.getElementById('total').textContent = all.length;

    const years = [...new Set(all.map(p => p.year))].sort((a, b) => b - a);
    let year = 'all';

    const chip = (val, label, n) =>
      `<button class="chip" type="button" data-y="${val}" aria-pressed="${val === year}">${label}<span class="c">${n}</span></button>`;
    function renderChips() {
      yearsEl.innerHTML = chip('all', 'All', all.length) +
        years.map(y => chip(String(y), y, all.filter(p => p.year === y).length)).join('');
    }
    yearsEl.addEventListener('click', e => {
      const b = e.target.closest('.chip');
      if (!b) return;
      year = b.dataset.y;
      renderChips();
      render();
    });

    function render() {
      const term = q.value.trim().toLowerCase();
      const rows = all
        .map((p, i) => ({ p, i }))
        .filter(({ p }) => year === 'all' || String(p.year) === year)
        .filter(({ p }) => !term || (p.title + ' ' + p.authors + ' ' + p.journal).toLowerCase().includes(term));
      listEl.innerHTML = rows.length
        ? rows.map(({ p, i }) => Pubs.render(p, i, all.length, { abstract: true })).join('')
        : '<li class="empty">No publications match that search.</li>';
      countEl.textContent = `Showing ${rows.length} of ${all.length}`;
    }

    q.addEventListener('input', render);
    renderChips();
    render();
  })();
</script>
</body>
